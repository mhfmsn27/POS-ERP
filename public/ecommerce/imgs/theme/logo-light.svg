      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="poshub_grad_dot" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
