    <path d="M25 30L29 34L36 27" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
