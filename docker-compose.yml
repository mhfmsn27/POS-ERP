version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poshub-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - poshub-network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: poshub-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - poshub-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: poshub-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-poshub_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-poshub}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - poshub-network

  redis:
    image: redis:7-alpine
    container_name: poshub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - poshub-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poshub-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - .:/var/www
    networks:
      - poshub-network
    depends_on:
      - app
      - redis
      - db

networks:
  poshub-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
