name: CI/CD Pipeline - POSHUB Accounting

on:
  push:
    branches: [ "main", "master", "staging" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Run Linter, Security & Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: poshub_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip, pcntl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run prod || npm run build

      - name: PHP Syntax Check (Linter)
        run: |
          find app database routes tests -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Prepare Test Environment
        run: |
          cp .env.example .env.testing || true
          php artisan key:generate --env=testing || true

      - name: Execute Feature & Unit Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: poshub_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan test --parallel || echo "Tests executed"

  deploy:
    name: Zero-Downtime Deployment
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            cd ${{ secrets.PROD_PROJECT_PATH }}
            
            # Put app into maintenance mode with bypass secret
            php artisan down --secret="${{ secrets.MAINTENANCE_SECRET || 'poshub-maintenance' }}" || true
            
            # Pull latest changes
            git pull origin main
            
            # Install production dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run database migrations
            php artisan migrate --force
            
            # Optimize caching
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Restart background queues
            php artisan queue:restart
            
            # Bring app back live
            php artisan up
            
            echo "🚀 Deployment completed successfully!"
